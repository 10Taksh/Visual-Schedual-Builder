<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Visual Schedule Builder{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  {% block head %}{% endblock %}
</head>
<body {% block body_attrs %}{% endblock %}>
  <nav class="site-nav" aria-label="Primary">
    <a class="brand" href="{{ url_for('pages.employees') }}">Visual Schedule Builder</a>
    <div class="nav-links">
      <a class="nav-link{% if request.endpoint == 'pages.employees' %} active{% endif %}" href="{{ url_for('pages.employees') }}">Employees</a>
      {% if positions %}
      <a class="nav-link{% if request.endpoint == 'pages.schedule' %} active{% endif %}" href="{{ url_for('pages.schedule', slug=positions[0].slug) }}">Schedule</a>
      {% endif %}
      <a class="nav-link{% if request.endpoint == 'pages.master' %} active{% endif %}" href="{{ url_for('pages.master') }}">Master</a>
    </div>
  </nav>

  <main class="shell">
    {% block content %}{% endblock %}
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>window.APP_META = {{ app_meta|tojson }};</script>
  {% block scripts %}{% endblock %}
</body>
</html>
